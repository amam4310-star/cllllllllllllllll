<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#1e1e2f}
.calculator{width:330px;padding:20px;border-radius:20px;background:#2b2b40;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.display{width:100%;height:80px;margin-bottom:20px;padding:15px;border:0;border-radius:12px;background:#171722;color:#fff;font-size:32px;text-align:right;outline:0}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;border:0;border-radius:12px;font-size:20px;cursor:pointer;background:#3b3b55;color:#fff;transition:.15s}
button:hover{background:#50506d}button:active{transform:scale(.95)}
.operator{background:#ff9500}.operator:hover{background:#ffad33}
.clear{background:#e74c3c}.clear:hover{background:#ff5c4d}
.equals{background:#2ecc71}.equals:hover{background:#45e889}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calculator">
<input type="text" class="display" id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button onclick="addToDisplay('%')">%</button>
<button class="operator" onclick="addToDisplay('/')">÷</button>
<button onclick="addToDisplay('7')">7</button>
<button onclick="addToDisplay('8')">8</button>
<button onclick="addToDisplay('9')">9</button>
<button class="operator" onclick="addToDisplay('*')">×</button>
<button onclick="addToDisplay('4')">4</button>
<button onclick="addToDisplay('5')">5</button>
<button onclick="addToDisplay('6')">6</button>
<button class="operator" onclick="addToDisplay('-')">−</button>
<button onclick="addToDisplay('1')">1</button>
<button onclick="addToDisplay('2')">2</button>
<button onclick="addToDisplay('3')">3</button>
<button class="operator" onclick="addToDisplay('+')">+</button>
<button class="zero" onclick="addToDisplay('0')">0</button>
<button onclick="addToDisplay('.')">.</button>
<button class="equals" onclick="calculate()">=</button>
</div>
</div>
<script>
const display=document.getElementById("display");
function addToDisplay(value){if(display.value==="0"||display.value==="Error")display.value=value;else display.value+=value}
function clearDisplay(){display.value="0"}
function deleteLast(){display.value=display.value.length>1?display.value.slice(0,-1):"0"}
function calculate(){try{let expression=display.value.replace(/(\d+(\.\d+)?)%/g,"($1/100)");display.value=eval(expression)}catch{display.value="Error"}}
document.addEventListener("keydown",e=>{
if((e.key>="0"&&e.key<="9")||"+-*/.".includes(e.key))addToDisplay(e.key);
if(e.key==="Enter")calculate();
if(e.key==="Escape")clearDisplay();
if(e.key==="Backspace")deleteLast();
});
</script>
</body>
</html>
